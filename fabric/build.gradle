plugins {
    id 'java'
    id 'fabric-loom'
}

base { archivesName = 'thunderhead-fabric' }

loom {
    runs {
        client { client() }
    }
    mods {
        tempestfx {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

repositories {
    // ModMenu only, and only at compile time: the entrypoint is optional and the jar never ships it.
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    modCompileOnly 'com.terraformersmc:modmenu:11.0.3'
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
