plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

base { archivesName = 'thunderhead-neoforge' }

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }
    runs {
        manualPreview {
            client()
            gameDirectory = project.file('run-audit')
            programArguments.addAll('--quickPlaySingleplayer', 'Mechanism Audit')
        }
        mechanismAudit {
            client()
            gameDirectory = project.file('run-audit')
            programArguments.addAll('--quickPlaySingleplayer', 'Mechanism Audit')
            systemProperty 'tempestfx.capture', 'true'
            systemProperty 'tempestfx.captureScene', 'mechanisms'
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArguments.add('--nogui')
        }
        qaClient {
            client()
            gameDirectory = project.file('run-qa-client')
            programArguments.addAll('--username', 'ThunderQA1', '--quickPlayMultiplayer', '127.0.0.1:25589')
            systemProperty 'tempestfx.capture', 'true'
            systemProperty 'tempestfx.multiplayerCapture', 'true'
            systemProperty 'tempestfx.captureFps', '30'
        }
        qaClient2 {
            client()
            gameDirectory = project.file('run-qa-client2')
            programArguments.addAll('--username', 'ThunderQA2', '--quickPlayMultiplayer', '127.0.0.1:25589')
            systemProperty 'tempestfx.capture', 'true'
            systemProperty 'tempestfx.multiplayerCapture', 'true'
            systemProperty 'tempestfx.captureFps', '60'
        }
        client {
            client()
            systemProperty 'tempestfx.smokeStrike', 'true'
            if (project.hasProperty('tempestfxCapture')) {
                systemProperty 'tempestfx.capture', 'true'
                systemProperty 'tempestfx.smokeStrike', 'false'
                if (project.hasProperty('tempestfxCaptureScene')) {
                    systemProperty 'tempestfx.captureScene', project.property('tempestfxCaptureScene').toString()
                }
                if (project.hasProperty('tempestfxCaptureFps')) {
                    systemProperty 'tempestfx.captureFps', project.property('tempestfxCaptureFps').toString()
                }
            }
            // -PtempestfxWorld="New World" boots straight into a save, so the smoke strike fires
            // without any manual interaction.
            if (project.hasProperty('tempestfxWorld')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('tempestfxWorld').toString())
            }
        }
    }
    mods {
        tempestfx { sourceSet sourceSets.main }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
